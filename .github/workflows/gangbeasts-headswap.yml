name: Build Gang Beasts Head Swap
on:
  push:
    paths:
      - 'GangBeastsHeadSwap/**'
      - '.github/workflows/gangbeasts-headswap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build GangBeastsHeadSwap/GangBeastsHeadSwap.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: GangBeastsHeadSwap-dll
          path: out/GangBeastsHeadSwap.dll
      - name: Commit DLL to dist/
        run: |
          mkdir -p dist
          cp out/GangBeastsHeadSwap.dll dist/GangBeastsHeadSwap.dll
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/GangBeastsHeadSwap.dll
          git commit -m "Build GangBeastsHeadSwap.dll [skip ci]" || echo "no changes"
          git pull --rebase origin main || true
          git push

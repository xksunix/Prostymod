name: Build Gang Beasts Jiggle
on:
  push:
    paths:
      - 'GangBeastsJiggle/**'
      - '.github/workflows/gangbeasts-jiggle.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build GangBeastsJiggle/GangBeastsJiggle.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: GangBeastsJiggle-dll
          path: out/GangBeastsJiggle.dll

name: Build Gang Beasts Jiggle
on:
  push:
    paths:
      - 'GangBeastsJiggle/**'
      - '.github/workflows/gangbeasts-jiggle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build GangBeastsJiggle/GangBeastsJiggle.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: GangBeastsJiggle-dll
          path: out/GangBeastsJiggle.dll
      - name: Commit DLL to dist/
        run: |
          mkdir -p dist
          cp out/GangBeastsJiggle.dll dist/GangBeastsJiggle.dll
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/GangBeastsJiggle.dll
          git commit -m "Build GangBeastsJiggle.dll [skip ci]" || echo "no changes"
          git push

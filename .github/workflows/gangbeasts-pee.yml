name: Build Gang Beasts Pee
on:
  push:
    paths:
      - 'GangBeastsPee/**'
      - '.github/workflows/gangbeasts-pee.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build GangBeastsPee/GangBeastsPee.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: GangBeastsPee-dll
          path: out/GangBeastsPee.dll
      - name: Commit DLL to dist/
        run: |
          mkdir -p dist
          cp out/GangBeastsPee.dll dist/GangBeastsPee.dll
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/GangBeastsPee.dll
          git commit -m "Build GangBeastsPee.dll [skip ci]" || echo "no changes"
          git push
